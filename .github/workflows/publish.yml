# Publishes @riffkit/cli to npm when a tag v<version> is pushed, through npm's
# trusted publishing (OIDC): no npm token is stored anywhere. The package's
# trusted publisher on npmjs.com must name this repository and this file.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # the OIDC token npm exchanges for a one-time publish credential

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: npm >= 11.5.1
        run: |
          npm install -g npm@^11.5.1
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm '+process.argv[1]+' is older than 11.5.1'); process.exit(1) }" "$(npm --version)"

      - run: node --test

      - name: Skip a version that is already published
        id: published
        run: |
          # Asked of the registry directly: 200 = this version exists, 404 = it does not.
          if node -e "fetch('https://registry.npmjs.org/@riffkit%2fcli/' + process.argv[1]).then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))" "${VERSION}"; then
            echo "@riffkit/cli@${VERSION} is already on npm: nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
